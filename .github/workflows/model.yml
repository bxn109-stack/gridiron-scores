name: Model backtest

on:
  workflow_dispatch:
  schedule:
    # Tuesday and Friday 09:17 UTC: fresh ratings, push tables and prop projections before the boards are built
    - cron: "17 9 * * 2,5"
  push:
    branches: [main]
    paths: ["model/*.py", ".github/workflows/model.yml"]

permissions:
  contents: write

concurrency:
  group: model
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # Raw College Football Data downloads stay in this private cache, never in the repo.
      - uses: actions/cache@v4
        with:
          path: model/.cache
          key: cfbd-${{ github.run_id }}
          restore-keys: cfbd-

      - name: Run college backtest
        if: github.event_name != 'schedule'
        env:
          CFBD_API_KEY: ${{ secrets.CFBDAPIKEY || secrets.CFBD_API_KEY }}
        run: python3 model/cfb_backtest.py

      - name: Ledger Model (NFL and college ratings, gates, push tables)
        continue-on-error: true
        timeout-minutes: 20
        env:
          CFBD_API_KEY: ${{ secrets.CFBDAPIKEY || secrets.CFBD_API_KEY }}
        run: python3 model/ledger_model.py

      - name: NFL prop projections
        continue-on-error: true
        timeout-minutes: 10
        run: python3 model/nfl_props.py

      - name: Run college efficiency model
        if: github.event_name != 'schedule'
        continue-on-error: true
        timeout-minutes: 35
        env:
          CFBD_API_KEY: ${{ secrets.CFBDAPIKEY || secrets.CFBD_API_KEY }}
        run: python3 model/cfb_eff.py

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/results || true
          if git diff --cached --quiet; then echo "No new results"; exit 0; fi
          git commit -q -m "Model backtest results $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          git push -q
