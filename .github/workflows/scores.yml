name: Fetch scores

on:
  schedule:
    # Every 15 minutes during US game windows (UTC: 11 AM to 2:59 AM Eastern). Scheduled runs can start late,
    # so each run keeps going on its own (every 5 minutes) while games are on.
    - cron: "*/15 0-6,15-23 * * *"
    # One full sweep a day to catch late stat corrections and the week ahead.
    - cron: "7 12 * * *"
  workflow_dispatch:
  # Also run right away when the robot's own code changes.
  push:
    branches: [main]
    paths: ["fetch_scores.py", ".github/workflows/scores.yml"]

permissions:
  contents: write

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ESPN scores (every 5 minutes while games are on)
        env:
          FULL: ${{ github.event_name != 'schedule' || github.event.schedule == '7 12 * * *' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add -A scores box
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "Scores $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            git push -q || echo "push failed; will retry next loop"
          }
          start=$(date +%s)
          full="$FULL"
          while true; do
            if [ "$full" = "true" ]; then python3 fetch_scores.py --full; full=false; else python3 fetch_scores.py; fi
            save
            if ! python3 fetch_scores.py --busy; then echo "No games on right now; stopping."; break; fi
            if [ $(( $(date +%s) - start )) -gt 19800 ]; then echo "Time limit reached; the next scheduled run takes over."; break; fi
            sleep 300
          done
