name: Basketball BPI test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["model/bb_bpi.py", ".github/workflows/bb_bpi.yml"]
  schedule:
    # Weekly re-run (Mondays 10:11 UTC) so the test picks up any newly back-filled closing lines.
    - cron: "11 10 * * 1"

permissions:
  contents: write

concurrency:
  group: bb-bpi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ESPN pregame win chances for past games and grade them against the closing line
        timeout-minutes: 220
        run: python3 model/bb_bpi.py

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bb/bpi_*.json model/results/bb_bpi.* || true
          if git diff --cached --quiet; then echo "No new results"; exit 0; fi
          git commit -q -m "Basketball BPI test $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep 10
          done
